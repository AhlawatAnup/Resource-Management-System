<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  </head>
  <link rel="stylesheet" href="/dashboard/teacher/style/teacher.dashboard.css" />
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active" id="home-nav">
          <i class="fas fa-home"></i>
          Home
        </a>
        <a href="/dashboard/teacher/view-requests" class="nav-item" id="view-requests-nav">
          <i class="fas fa-eye"></i>
          View Resource Requests
        </a>
        <a href="/dashboard/teacher/about-us" class="nav-item">
          <i class="fas fa-info-circle"></i>
          About Us
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1 id="hello-user">Hello, Teacher</h1>
          <p>Track students progress here. Approve or Deny.</p>
        </div>
      </header>

      <!-- Teacher Profile Section -->
      <div id="teacher-profile-section" style="margin-bottom: 30px;">
        <!-- Teacher profile will be loaded here by JavaScript -->
      </div>

      <div class="container">
        <div class="header">
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              placeholder="Search Student"
              id="searchInput"
            />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="name">Student Name</th>
                <th class="sortable" data-sort="contact">Contact</th>
                <th class="sortable" data-sort="status">Approval Status</th>
                <th class="sortable" data-sort="branch">Branch</th>
                <th class="sortable">Action</th>
              </tr>
            </thead>
            <tbody id="contactTableBody">
              <!-- Table rows will be populated by JavaScript -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/dashboard/teacher/js/teacher.dashboard.js"></script>
    <!-- <script src="/dashboard/teacher/js/table.js"></script> -->
  </body>
</html>
