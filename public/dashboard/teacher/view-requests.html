<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - View Requests</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    
  </head>
  <link rel="stylesheet" href="/dashboard/teacher/style/teacher.dashboard.css" />
  <link rel="stylesheet" href="/dashboard/common/style/purpose-panel.css" />
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item" id="home-nav">
          <i class="fas fa-home"></i>
          Home
        </a>
        <a href="#" class="nav-item active" id="view-requests-nav">
          <i class="fas fa-eye"></i>
          View Resource Requests 
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1>View Resource Requests</h1>
          <p>Review and manage student resource requests here.</p>
        </div>
      </header>

      <div class="container">
        <div class="header">
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              placeholder="Search Requests"
              id="searchInput"
            />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="student">Student</th>
                <th class="sortable" data-sort="title">Request Title</th>
                <th class="sortable" data-sort="purpose">Purpose</th>
                <th class="sortable" data-sort="resources">Resources</th>
                <th class="sortable" data-sort="expiry">Expiry Date</th>
                <th class="sortable" data-sort="status">Status</th>
                <th class="sortable">Action</th>
              </tr>
            </thead>
            <tbody id="requestsTableBody">
              <tr>
                <td colspan="7" class="loading">Loading resource requests...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- Edit Resource Request Modal (Teacher, styled like Admin) -->
        <div id="editRequestModal" class="modal">
          <div class="modal-content">
            <div class="modal-header">
              <h3><i class="fas fa-pen-to-square"></i> Edit Resource Request</h3>
              <button class="close-btn" id="closeEditModal">&times;</button>
            </div>
            <form id="editRequestForm">
              <input type="hidden" id="editRequestId" />
              <div class="modal-body">
                <div class="form-row">
                  <div class="form-group">
                    <label for="editTitle">Title:</label>
                    <input type="text" id="editTitle" name="title" class="form-control" required />
                    <div id="edit-title-error" style="color: red; font-size: 0.9em; margin-top: 2px;"></div>
                  </div>
                  <div class="form-group">
                    <label for="editPurpose">Purpose:</label>
                    <input type="text" id="editPurpose" name="purpose" class="form-control" required />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label for="editExpiryDate">Expiry Date:</label>
                    <input type="date" id="editExpiryDate" name="expiryDate" class="form-control" required />
                  </div>
                </div>
                <div class="form-row">
                  <!-- <div class="form-group">
                    <label for="editCpuCores">CPU Cores:</label>
                    <input type="number" id="editCpuCores" name="cpuCores" class="form-control" min="1" required />
                  </div>
                  <div class="form-group">
                    <label for="editCpuRam">CPU RAM (GB):</label>
                    <input type="number" id="editCpuRam" name="cpuRam" class="form-control" min="1" required />
                  </div> -->
                </div>
                <div class="form-row">
                  <!-- <div class="form-group">
                    <label for="editGpuCount">GPU Count:</label>
                    <input type="number" id="editGpuCount" name="gpuCount" class="form-control" min="0" required />
                  </div> -->
                  <div class="form-group">
                    <label for="editGpuRam">GPU RAM (GB):</label>
                    <input type="number" id="editGpuRam" name="gpuRam" class="form-control" min="0" required />
                  </div>
                  <div class="form-group">
                    <label for="editUsername">Username:</label>
                    <input type="text" id="editUsername" name="username" class="form-control" />
                    <div id="edit-username-error" style="color: red; font-size: 0.9em; margin-top: 2px;"></div>
                  </div>
                </div>
              </div>
              <div class="modal-footer">
                <!-- <button type="button" class="btn btn-secondary" id="closeEditModal">Cancel</button> -->
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <!-- Purpose View Panel -->
    <div id="purposePanel" class="purpose-panel">
      <div class="purpose-panel-header">
        <span class="purpose-panel-title">Request Purpose</span>
        <button class="purpose-panel-close" onclick="closePurposePanel()">&times;</button>
      </div>
      <div class="purpose-panel-body">
        <textarea id="purposeText" readonly></textarea>
      </div>
    </div>

    <script type="module" src="/dashboard/teacher/js/view-requests.js"></script>
  </body>
</html>
