<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - View Requests</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <link rel="stylesheet" href="/dashboard/teacher/style/teacher.dashboard.css" />
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="teacher.dashboard.html" class="nav-item" id="home-nav">
          <i class="fas fa-home"></i>
          Home
        </a>
        <a href="#" class="nav-item active" id="view-requests-nav">
          <i class="fas fa-eye"></i>
          View Requests
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1>View Requests</h1>
          <p>Review and manage student resource requests here.</p>
        </div>
      </header>

      <div class="container">
        <div class="header">
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              placeholder="Search Requests"
              id="searchInput"
            />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="student">Student</th>
                <th class="sortable" data-sort="title">Request Title</th>
                <th class="sortable" data-sort="purpose">Purpose</th>
                <th class="sortable" data-sort="resources">Resources</th>
                <th class="sortable" data-sort="expiry">Expiry Date</th>
                <th class="sortable" data-sort="status">Status</th>
                <th class="sortable">Action</th>
              </tr>
            </thead>
            <tbody id="requestsTableBody">
              <tr>
                <td colspan="7" class="loading">Loading resource requests...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- Edit Resource Request Modal -->
        <div id="editRequestModal" class="modal" style="display:none;">
          <div class="modal-content">
            <span class="close" id="closeEditModal">&times;</span>
            <h2>Edit Resource Request</h2>
            <form id="editRequestForm">
              <input type="hidden" id="editRequestId" />
              <label>Title: <input type="text" id="editTitle" required /></label><br />
              <label>Purpose: <textarea id="editPurpose" required></textarea></label><br />
              <label>Expiry Date: <input type="date" id="editExpiryDate" required /></label><br />
              <label>CPU Cores: <input type="number" id="editCpuCores" min="1" required /></label><br />
              <label>CPU RAM (GB): <input type="number" id="editCpuRam" min="1" required /></label><br />
              <label>GPU Count: <input type="number" id="editGpuCount" min="0" required /></label><br />
              <label>GPU RAM (GB): <input type="number" id="editGpuRam" min="0" required /></label><br />
              <button type="submit">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/dashboard/teacher/js/view-requests.js"></script>
  </body>
</html>
