<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- importing darkmode files on top to avoid delay -->
    <script src="https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js"></script>
    <script src="/dashboard/common/js/darkmode/darkmode-init.js"></script>
    <link rel="stylesheet" href="/dashboard/common/style/darkmode/darkmode-button.css">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - View Requests</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    
  </head>
  <link rel="stylesheet" href="/dashboard/teacher/style/teacher.dashboard.css" />
  <link rel="stylesheet" href="/dashboard/common/style/purpose-panel.css" />
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item" id="home-nav">
          <i class="fas fa-home"></i>
          Home
        </a>
        <a href="#" class="nav-item active" id="view-requests-nav">
          <i class="fas fa-eye"></i>
          View Resource Requests 
        </a>
        <a href="/dashboard/teacher/allotments" class="nav-item">
          <i class="fas fa-network-wired"></i>
          Check Machine Availability
        </a>
        <a href="https://aicentre.gitbook.io/aicentre-docs" target="_blank" class="nav-item">
          <i class="fas fa-book"></i>
          User Manual
        </a>
        <a href="/dashboard/teacher/about-us" class="nav-item">
          <i class="fas fa-info-circle"></i>
          About Us
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="#" onclick="handleLogout(event)" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1>View Resource Requests</h1>
          <p>Review and manage student resource requests here.</p>
        </div>
        <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
          <i id="theme-icon" class="fa fa-moon"></i>
        </button>
      </header>

      <div class="container">
        <div class="header">
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              placeholder="Search Requests"
              id="searchInput"
            />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="student">Student</th>
                <th class="sortable" data-sort="title">Request Title</th>
                <th class="sortable" data-sort="purpose">Purpose</th>
                <th class="sortable" data-sort="migid">MIG ID</th>
                <th class="sortable" data-sort="duration">Duration (days)</th>
                <th class="sortable" data-sort="status">Status</th>
                <th class="sortable">Action</th>
              </tr>
            </thead>
            <tbody id="requestsTableBody">
              <tr>
                <td colspan="7" class="loading">Loading resource requests...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Purpose View Panel -->
    <div id="purposePanel" class="purpose-panel">
      <div class="purpose-panel-header">
        <span class="purpose-panel-title">Request Purpose</span>
        <button class="purpose-panel-close" onclick="closePurposePanel()">&times;</button>
      </div>
      <div class="purpose-panel-body">
        <textarea id="purposeText" readonly></textarea>
      </div>
    </div>

    <!-- <script type="module" src="/dashboard/teacher/js/view-requests.js"></script> -->
    <script type="module" src="/dashboard/teacher/js/view-requests/teacher-view-request.main.js"></script>
  </body>
</html>
