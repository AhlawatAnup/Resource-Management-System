<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allotments - U.I.E.T Resource Sharing</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/e05e3e1522.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <link rel="stylesheet" href="/dashboard/admin/style/admin.dashboard.css" />
    <link rel="stylesheet" href="/dashboard/common/style/allotments/machines-flexbar.css" />
    <link rel="stylesheet" href="/dashboard/common/style/allotments/allotments-calendar.css" />
    <link rel="stylesheet" href="/dashboard/common/style/allotments/allotments.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">
                <img src="../../assets/images/UIET-logo.png" alt="Logo" />
            </div>
            U.I.E.T
        </div>

        <nav class="nav-menu">
            <a href="/dashboard" class="nav-item">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="/dashboard/admin/view-requests" class="nav-item">
                <i class="fas fa-list"></i> View Resource Requests
            </a>
            <a href="/dashboard/admin/machines-page" class="nav-item">
                <i class="fas fa-desktop"></i> Machines
            </a>
            <a href="#" class="nav-item active">
                <i class="fas fa-network-wired"></i> Allotments
            </a>
            <a href="/dashboard/admin/profile" class="nav-item">
                <i class="fas fa-user"></i> Profile
            </a>
        </nav>

        <div style="padding: 20px">
            <a href="#" onclick="handleLogout(event)" class="nav-item">
                <i class="fas fa-sign-out-alt"></i> Log out
            </a>
        </div>
    </div>

    <div class="main-wrapper">
    <main class="main-content" style="padding: 24px;">
        <header class="page-header">
            <div class="header-info">
                <h1 id="page-title">Resource Allotments</h1>
                <p>Select a machine to view its monthly availability.</p>
            </div>
        </header>

        <div class="container" style="background: none; box-shadow: none; padding: 0;">
            <div class="allotments-page-layout">
                <div class="machines-side-panel">
                    <div class="machines-bar-section">
                        <h3><i class="fas fa-server"></i> Machines</h3>
                        <div id="machines-flexbar" class="machines-flexbar">
                            <span class="machine-bar-loading">Loading machines...</span>
                        </div>
                    </div>
                </div>

                <div class="allotments-main-panel">
                    <div class="allotments-card" style="width: 100%; min-height: 500px; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 12px;">

                        <div id="allotments-content" style="width: 100%;">
                            <div id="placeholder-text" class="allotments-placeholder" style="text-align: center; color: #888;">
                                <i class="fas fa-calendar-alt" style="font-size: 3rem; margin-bottom: 15px; display: block;"></i>
                                <p>Please select a machine from the left panel to view the schedule.</p>
                            </div>

                            <div id="calendar-view" style="display: none; text-align: center; width: 100%;">
                                <h2 id="selected-machine-name" style="margin-bottom: 20px; color: #333; font-weight: 600;"></h2>

                                <div id="inline-calendar-anchor"></div>

                                <div class="calendar-legend" style="margin-top: 25px; display: flex; justify-content: center; gap: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                                    <div style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                                        <span style="width: 15px; height: 15px; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 3px; display: inline-block;"></span>
                                        <span style="color: #b45359;">Allotted (Occupied)</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem;">
                                        <span style="width: 15px; height: 15px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 3px; display: inline-block;"></span>
                                        <span style="color: #2f6b3b; font-weight: 600;">Free Slot</span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    </div>

    <script type="module" src="/dashboard/common/js/allotments/allotments.main.js"></script>
</body>
</html>
