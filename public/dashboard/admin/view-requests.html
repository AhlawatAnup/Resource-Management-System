<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - Admin View Requests</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <link rel="stylesheet" href="/dashboard/admin/style/admin.dashboard.css" />
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="admin.dashboard.html" class="nav-item" id="dashboard-nav">
          <i class="fas fa-home"></i>
          Dashboard
        </a>
        <a href="#" class="nav-item active" id="view-requests-nav">
          <i class="fas fa-eye"></i>
          View Requests
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-wrapper">
      <nav class="top-nav">
        <div class="nav-brand">
          <h2>Resource Requests Management</h2>
        </div>
        
        <div class="nav-actions">
          <div class="admin-info">
            <span class="admin-name">Hello, Admin</span>
          </div>
        </div>
      </nav>

      <main class="main-content">
        <header class="page-header">
          <div class="header-info">
            <h1>View Resource Requests</h1>
            <p>Review and manage all student resource requests</p>
          </div>
        </header>

        <div class="container">
          <div class="header">
            <div class="search-container">
              <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
                <path
                  fill-rule="evenodd"
                  d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                  clip-rule="evenodd"
                />
              </svg>
              <input
                type="text"
                class="search-input"
                placeholder="Search Requests"
                id="searchInput"
              />
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th class="sortable" data-sort="student">Student</th>
                  <th class="sortable" data-sort="teacher">Teacher</th>
                  <th class="sortable" data-sort="title">Request Title</th>
                  <th class="sortable" data-sort="purpose">Purpose</th>
                  <th class="sortable" data-sort="resources">Resources</th>
                  <th class="sortable" data-sort="expiry">Expiry Date</th>
                  <th class="sortable" data-sort="status">Status</th>
                  <th class="sortable">Action</th>
                </tr>
              </thead>
              <tbody id="requestsTableBody">
                <tr>
                  <td colspan="8" class="loading">Loading resource requests...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/dashboard/admin/js/admin-view-requests.js"></script>
  </body>
</html>
