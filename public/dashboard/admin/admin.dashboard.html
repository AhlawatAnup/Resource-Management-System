<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- importing darkmode files on top to avoid delay -->
    <script src="https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js"></script>
    <script src="/dashboard/common/js/darkmode/darkmode-init.js"></script>
    <link rel="stylesheet" href="/dashboard/common/style/darkmode/darkmode-button.css">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - Admin</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard/admin/style/admin.dashboard.css" />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
  </head>
  
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active" id="dashboard-nav">
          <i class="fas fa-home"></i>
          Dashboard
        </a>
        <a href="/dashboard/admin/view-requests" class="nav-item" id="view-requests-nav">
          <i class="fas fa-list"></i>
          View Resource Requests
        </a>
        <a href="/dashboard/admin/machines-page" class="nav-item" id="view-requests-nav">
          <i class="fas fa-desktop"></i>
          Machines
        </a>
        <a href="/dashboard/admin/allotments" class="nav-item" id="view-requests-nav">
          <i class="fas fa-network-wired"></i>
          Check Machine Availability
        </a>
        <a href="https://aicentre.gitbook.io/aicentre-docs" target="_blank" class="nav-item">
          <i class="fas fa-book"></i>
          User Manual
        </a>
        <a href="/dashboard/admin/profile" class="nav-item" id="view-requests-nav">
          <i class="fas fa-user"></i>
          Profile
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="#" onclick="handleLogout(event)" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <!-- Main Content with Top Navigation -->
    <div class="main-wrapper">
      <!-- Top Navigation Bar -->
      <nav class="top-nav">
        <div class="nav-brand">
          <h2>User Management</h2>
        </div>
        
        <div class="nav-controls">
          <!-- Part A: User Type Selection -->
          <div class="nav-section">
            <div class="nav-group">
              <button class="nav-btn active" data-type="teacher">
                <i class="fas fa-chalkboard-teacher"></i>
                Teacher
              </button>
              <button class="nav-btn" data-type="student">
                <i class="fas fa-graduation-cap"></i>
                Student
              </button>
            </div>
          </div>
          
          <!-- Part B: Status Filter -->
          <div class="nav-section">
            <div class="nav-group">
              <button class="status-btn active" data-status="all">
                <i class="fas fa-users"></i>
                All
                <span class="count-badge" id="all-count">0</span>
              </button>
              <button class="status-btn" data-status="unverified">
                <i class="fas fa-user-clock"></i>
                Unverified
                <span class="count-badge" id="unverified-count">0</span>
              </button>
              <button class="status-btn" data-status="verified">
                <i class="fas fa-user-check"></i>
                Verified
                <span class="count-badge" id="verified-count">0</span>
              </button>
              <button class="status-btn" data-status="rejected">
                <i class="fas fa-user-times"></i>
                Rejected
                <span class="count-badge" id="rejected-count">0</span>
              </button>
            </div>
          </div>
        </div>
        
        <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
            <i id="theme-icon" class="fa fa-moon"></i>
          </button>
        </div>
      </nav>

      <main class="main-content">
    <main class="main-content">
      

      <div class="content">
        <div class="table">
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              placeholder="Search users..."
              id="searchInput"
            />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr id="table-headers">
                <!-- Headers will be dynamically updated based on selection -->
              </tr>
            </thead>
            <tbody id="dataTableBody">
              <tr>
                <td colspan="6" class="loading">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    
    </div>
     <!-- End main-wrapper -->

    <!-- <script type="module" src="/dashboard/admin/js/admin.dashboard.js"></script> -->
    <script type="module" src="/dashboard/admin/js/dashboard/admin-dashboard.main.js"></script>

  </body>
</html>
