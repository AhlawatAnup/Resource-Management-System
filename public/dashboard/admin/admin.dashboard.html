<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - Admin</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <link rel="stylesheet" href="/dashboard/admin/style/admin.dashboard.css" />
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <i class="fas fa-home"></i>
          Home
        </a>
        <!-- <a href="#" class="nav-item">
          <i class="fas fa-users"></i>
          Users
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-chart-bar"></i>
          Analytics
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-cog"></i>
          Settings
        </a>
      </nav> -->

      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1 id="hello-user">Hello, Admin</h1>
          <p>Manage system users and monitor platform activity.</p>
        </div>
      </header>

      <div class="container">
        <div class="header">
          <div class="search-container">
            <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
            <input
              type="text"
              class="search-input"
              placeholder="Search Users"
              id="searchInput"
            />
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th class="sortable" data-sort="name">User Name</th>
                <th class="sortable" data-sort="role">Role</th>
                <th class="sortable" data-sort="status">Status</th>
                <th class="sortable" data-sort="date">Join Date</th>
                <th class="sortable">Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr>
                <td colspan="5" class="loading">No users data available</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script type="module" src="/dashboard/admin/js/admin.dashboard.js"></script>
  </body>
</html>
