<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - Admin Profile</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../common/style/dashboard-common.css" />
    <link rel="stylesheet" href="/dashboard/admin/style/profile.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
            <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>
      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item" id="dashboard-nav">
          <i class="fas fa-home"></i>
          Dashboard
        </a>
        <a href="/dashboard/admin/view-requests" class="nav-item" id="view-requests-nav">
          <i class="fas fa-list"></i>
          View Resource Requests
        </a>
        <a href="/dashboard/admin/machines-page" class="nav-item" id="machines-nav">
          <i class="fas fa-desktop"></i>
          Machines
        </a>
        <a href="#" class="nav-item active" id="profile-nav">
          <i class="fas fa-user"></i>
          Profile
        </a>
      </nav>
      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>
    <!-- Sidebar Ends-->
    <!-- Header -->
    <div class="main-wrapper">
      <nav class="top-nav">
        <div class="nav-brand">
          <h2>Profile</h2>
        </div>
        <div class="nav-actions">
          <div class="admin-info">
            <span class="admin-name">Hello, Admin</span>
          </div>
        </div>
      </nav>
      <main class="main-content">
        <section class="profile-section">
          <h2>Admin Profile</h2>
          <div style="display:flex;align-items:center;gap:8px;">
            <strong>Username:</strong> <span id="admin-username"></span>
            <button id="edit-username-btn" class="nav-btn" style="padding:4px 10px;font-size:14px;">Edit</button>
          </div>
          <!-- <div><strong>Name:</strong> <span id="admin-name"></span></div> -->
          <div style="display:flex;align-items:center;gap:8px;">
            <strong>Email:</strong> <span id="admin-email"></span>
            <button id="edit-email-btn" class="nav-btn" style="padding:4px 10px;font-size:14px;">Edit</button>
          </div>
          <!-- Edit Email Modal -->
          <div id="edit-email-modal" class="profile-modal" style="display:none;">
            <div class="profile-modal-content">
              <button class="profile-modal-close" id="close-email-modal">&times;</button>
              <h3>Edit Email</h3>
              <input type="email" id="new-email-input" placeholder="New Email" style="padding:8px;border-radius:6px;border:1px solid #ccc;" />
              <div style="display:flex;gap:10px;margin-top:16px;">
                <button id="submit-email-btn" class="nav-btn" style="background:#27ae60;color:#fff;">Submit</button>
                <button id="cancel-email-btn" class="nav-btn" style="background:#eee;color:#333;">Cancel</button>
              </div>
              <div id="email-error" style="color: red;"></div>
            </div>
          </div>
          <!-- Change Password Modal -->
          <div id="change-password-modal" class="profile-modal" style="display:none;">
            <div class="profile-modal-content">
              <button class="profile-modal-close" id="close-password-modal">&times;</button>
              <h3>Change Password</h3>
              <input type="password" id="new-password" placeholder="New Password" style="padding:8px;border-radius:6px;border:1px solid #ccc;" />
              <input type="password" id="confirm-password" placeholder="Confirm Password" style="padding:8px;border-radius:6px;border:1px solid #ccc;" />
              <div style="display:flex;gap:10px;margin-top:16px;">
                <button id="submit-password-btn" class="nav-btn" style="background:#27ae60;color:#fff;">Submit</button>
                <button id="cancel-password-btn" class="nav-btn" style="background:#eee;color:#333;">Cancel</button>
              </div>
              <div id="password-error" style="color: red;"></div>
            </div>
          </div>
          <!-- Edit Username Modal -->
          <div id="edit-username-modal" class="profile-modal" style="display:none;">
            <div class="profile-modal-content">
              <button class="profile-modal-close" id="close-username-modal">&times;</button>
              <h3>Edit Username</h3>
              <input type="text" id="new-username-input" placeholder="New Username" style="padding:8px;border-radius:6px;border:1px solid #ccc;" />
              <div style="display:flex;gap:10px;margin-top:16px;">
                <button id="submit-username-btn" class="nav-btn" style="background:#27ae60;color:#fff;">Submit</button>
                <button id="cancel-username-btn" class="nav-btn" style="background:#eee;color:#333;">Cancel</button>
              </div>
              <div id="username-error" style="color: red;"></div>
            </div>
          </div>
          <div id="profile-error" style="color: red;"></div>
          <button id="change-password-btn" class="nav-btn" style="margin-top:20px;">Change Password</button>
        </section>
      </main>
    </div>
    <!-- Header Ends-->
    <script type="module" src="/dashboard/admin/js/profile.js"></script>
  </body>
</html>
