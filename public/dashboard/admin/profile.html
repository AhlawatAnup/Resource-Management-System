<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.I.E.T Resource Sharing - Admin Profile</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/dashboard/admin/style/dashboard-common.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-layer-group"></i>
        </div>
        U.I.E.T
      </div>
      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item" id="dashboard-nav">
          <i class="fas fa-home"></i>
          Dashboard
        </a>
        <a href="/dashboard/admin/view-requests" class="nav-item" id="view-requests-nav">
          <i class="fas fa-eye"></i>
          View Resource Requests
        </a>
        <a href="/dashboard/admin/machines-page" class="nav-item" id="machines-nav">
          <i class="fas fa-desktop"></i>
          Machines
        </a>
        <a href="#" class="nav-item active" id="profile-nav">
          <i class="fas fa-user"></i>
          Profile
        </a>
      </nav>
      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>
    <!-- Sidebar Ends-->
    <!-- Header -->
    <div class="main-wrapper">
      <nav class="top-nav">
        <div class="nav-brand">
          <h2>Profile</h2>
        </div>
        <div class="nav-actions">
          <div class="admin-info">
            <span class="admin-name">Hello, Admin</span>
          </div>
        </div>
      </nav>
      <main class="main-content">
        <section class="profile-section">
          <h2>Admin Profile</h2>
          <div><strong>Username:</strong> <span id="admin-username"></span></div>
          <div><strong>Name:</strong> <span id="admin-name"></span></div>
          <div><strong>Email:</strong> <span id="admin-email"></span></div>
          <div id="profile-error" style="color: red;"></div>
          <button id="change-password-btn" class="nav-btn" style="margin-top:20px;">Change Password</button>
          <div id="change-password-form" style="display:none;align-items:center;gap:16px;margin-top:20px;">
            <input type="password" id="new-password" placeholder="New Password" style="padding:8px;border-radius:6px;border:1px solid #ccc;" />
            <input type="password" id="confirm-password" placeholder="Confirm Password" style="padding:8px;border-radius:6px;border:1px solid #ccc;" />
            <button id="submit-password-btn" class="nav-btn">Submit</button>
          </div>
        </section>
      </main>
    </div>
    <!-- Header Ends-->
    <script src="/dashboard/admin/js/profile.js"></script>
  </body>
</html>
