<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Resources - U.I.E.T Resource Sharing</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    
    <link rel="stylesheet" href="/dashboard/student/style/student.dashboard.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.request.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item">
          <i class="fas fa-home"></i>
          Home
        </a>
        <a href="#" class="nav-item active">
          <i class="fas fa-plus-circle"></i>
          Request Resources
        </a>
        <a href="/dashboard/student/view-requests" class="nav-item">
          <i class="fas fa-list"></i>
          View Resource Requests
        </a>
        <a href="/dashboard/student/about-us" class="nav-item">
          <i class="fas fa-info-circle"></i>
          About Us
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="#" onclick="handleLogout(event)" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1 id="page-title">Request Resources</h1>
          <p>Submit your resource requests and manage your submissions.</p>
        </div>
      </header>

      <div class="container">
        <!-- Resource Request Section -->
        <div id="request-content">
          <!-- Content will be loaded here by JavaScript -->
        </div>
      </div>
    </main>

    <script type="module" src="/dashboard/student/js/student.request.js"></script>
  </body>
</html>
