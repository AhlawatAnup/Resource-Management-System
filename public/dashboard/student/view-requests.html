<!doctype html>
<html lang="en">
  <head>
    <!-- importing darkmode files on top to avoid delay -->
    <script src="https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js"></script>
    <script src="/dashboard/common/js/darkmode/darkmode-init.js"></script>
    <link rel="stylesheet" href="/dashboard/common/style/darkmode/darkmode-button.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Requests - U.I.E.T Resource Sharing</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/e05e3e1522.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="/dashboard/student/style/student.dashboard.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.request.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.table.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item">
          <i class="fas fa-home"></i>
          Home
        </a>
        <a href="/dashboard/student/request-resources" class="nav-item">
          <i class="fas fa-plus-circle"></i>
          Raise Resource Requests
        </a>
        <a href="#" class="nav-item active">
          <i class="fas fa-list"></i>
          View Resource Requests
        </a>
        <a href="/dashboard/student/allotments" class="nav-item">
          <i class="fas fa-network-wired"></i>
          Check Machine Availability
        </a>
        <a href="https://aicentre.gitbook.io/aicentre-docs" target="_blank" class="nav-item">
          <i class="fas fa-book"></i>
          User Manual
        </a>
        <a href="/dashboard/student/about-us" class="nav-item">
          <i class="fas fa-info-circle"></i>
          About Us
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="#" onclick="handleLogout(event)" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1 id="page-title">Your Requests</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
          <i id="theme-icon" class="fa fa-moon"></i>
        </button>
      </header>

      <div class="container">
        <!-- Requests Section -->
        <div id="requests-content">
          <!-- Content will be loaded here by JavaScript -->
        </div>
      </div>
    </main>

    <!-- <script type="module" src="/dashboard/student/js/student.view-requests.js"></script> -->
    <script
      type="module"
      src="/dashboard/student/js/view-requests/student-view-request.main.js"
    ></script>
  </body>
</html>
