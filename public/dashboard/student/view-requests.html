<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>View Requests - U.I.E.T Resource Sharing</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/dashboard/student/style/student.dashboard.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.request.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.table.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <i class="fas fa-layer-group"></i>

      <nav class="nav-menu">

        <a href="/dashboard/student/request-resources.html" class="nav-item">

        </a>
        <a href="#" class="nav-item active">

        </a>

      <div style="padding: 20px">
        <a href="/logout" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>

        </a>

        <div class="welcome-section">
