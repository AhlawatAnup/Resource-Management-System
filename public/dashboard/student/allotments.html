<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allotments - U.I.E.T Resource Sharing</title>

    <!-- Icons -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/e05e3e1522.js"
      crossorigin="anonymous"
    ></script>

    <!-- Common styles -->
    <link rel="stylesheet" href="/dashboard/student/style/student.dashboard.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.request.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.table.css" />
    <link rel="stylesheet" href="/dashboard/student/style/machines-flexbar.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.allotments.css" />


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item">
          <i class="fas fa-home"></i>
          Home
        </a>
        <a href="/dashboard/student/request-resources" class="nav-item">
          <i class="fas fa-plus-circle"></i>
          Request Resources
        </a>
        <a href="/dashboard/student/view-requests" class="nav-item">
          <i class="fas fa-list"></i>
          View Resource Requests
        </a>
        <a href="/dashboard/student/allotments" class="nav-item active">
          <i class="fas fa-network-wired"></i>
          Allotments
        </a>
        <a href="/dashboard/student/about-us" class="nav-item">
          <i class="fas fa-info-circle"></i>
          About Us
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="#" onclick="handleLogout(event)" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          Log out
        </a>
      </div>
    </div>

    <main class="main-content">
      <header class="header">
        <div class="welcome-section">
          <h1 id="page-title">Allotments</h1>
          <p>Machine-wise allotments.</p>
        </div>
      </header>

      <div class="container" style="background: none; box-shadow: none; padding: 0;">
        <div class="allotments-page-layout">
          <!-- Left: Machines flex bar -->
          <div class="machines-side-panel">
            <div class="machines-bar-section">
              <h3><i class="fas fa-server"></i> Machines</h3>
              <div id="machines-flexbar" class="machines-flexbar">
                <span class="machine-bar-loading">Loading...</span>
              </div>
            </div>
          </div>

          <!-- Right: Allotments content -->
          <div class="allotments-main-panel">
            <div class="allotments-card">
              <div id="allotments-content">
                <p class="allotments-placeholder"><i class="fas fa-arrow-left"></i> Select a machine to view its allotments.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Page-specific script -->
    <script type="module" src="/dashboard/student/js/allotments/student-allotments.main.js"></script>
  </body>
</html>
