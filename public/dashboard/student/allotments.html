<!doctype html>
<html lang="en">
  <head>
    <!-- importing darkmode files on top to avoid delay -->
    <script src="https://cdn.jsdelivr.net/npm/darkreader/darkreader.min.js"></script>
    <script src="/dashboard/common/js/darkmode/darkmode-init.js"></script>
    <link rel="stylesheet" href="/dashboard/common/style/darkmode/darkmode-button.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allotments - U.I.E.T Resource Sharing</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <script src="https://kit.fontawesome.com/e05e3e1522.js" crossorigin="anonymous"></script>

    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"> -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css" />

    <link rel="stylesheet" href="/dashboard/student/style/student.dashboard.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.request.css" />
    <link rel="stylesheet" href="/dashboard/student/style/student.table.css" />
    <link rel="stylesheet" href="/dashboard/common/style/allotments/machines-flexbar.css" />
    <link rel="stylesheet" href="/dashboard/common/style/allotments/allotments-calendar.css" />
    <link rel="stylesheet" href="/dashboard/common/style/allotments/allotments.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script> -->
  </head>
  <body>
    <div class="sidebar">
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/images/UIET-logo.png" alt="Logo" />
        </div>
        U.I.E.T
      </div>

      <nav class="nav-menu">
        <a href="/dashboard" class="nav-item"> <i class="fas fa-home"></i> Home </a>
        <a href="/dashboard/student/request-resources" class="nav-item">
          <i class="fas fa-plus-circle"></i> Raise Resource Requests
        </a>
        <a href="/dashboard/student/view-requests" class="nav-item">
          <i class="fas fa-list"></i> View Resource Requests
        </a>
        <a href="#" class="nav-item active">
          <i class="fas fa-network-wired"></i> Check Machine Availability
        </a>
        <a href="https://aicentre.gitbook.io/aicentre-docs" target="_blank" class="nav-item">
          <i class="fas fa-book"></i>
          User Manual
        </a>
        <a href="/dashboard/student/about-us" class="nav-item">
          <i class="fas fa-info-circle"></i> About Us
        </a>
      </nav>

      <div style="padding: 20px">
        <a href="#" onclick="handleLogout(event)" class="nav-item">
          <i class="fas fa-sign-out-alt"></i> Log out
        </a>
      </div>
    </div>
     
     <div class="main-wrapper">
     <main class="main-content">
        <nav class="header">
          <div class="nav-brand">
            <h2>Check Machine Availabilty</h2>
          </div>
          <div class="nav-actions">
            <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
              <i id="theme-icon" class="fa fa-moon"></i>
            </button>
          </div>
        </nav>

        <div class="container" style="background: none; box-shadow: none; margin-top: 10px">
          <div class="allotments-page-layout">
            <div id="machines-flexbar" class="machines-flexbar">
              <span class="machine-bar-loading">Loading machines...</span>
            </div>

            <div class="allotments-main-panel">
              <div id="allotments-content" style="width: 100%">
                <div
                  id="placeholder-text"
                  class="allotments-placeholder"
                  style="text-align: center; color: #888"
                >
                  <i
                    class="fas fa-calendar-alt"
                    style="font-size: 3rem; margin-bottom: 15px; display: block"
                  ></i>
                  <p>Please select a machine from the left panel to view the schedule.</p>
                </div>

                <div id="calendar-view" style="display: none; text-align: center; width: 100%">
                  <h2 id="selected-machine-name" style="color: #333; font-weight: 600"></h2>

                  <div id="inline-calendar-anchor"></div>

                  <div
                    class="calendar-legend"
                    style="
                      display: flex;
                      justify-content: center;
                      gap: 30px;
                      border-top: 1px solid #eee;
                      padding-top: 20px;
                    "
                  >
                    <div style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem">
                      <!-- <span style="width: 15px; height: 15px; background: #fff1f2; border: 1px solid #fecdd3; border-radius: 3px; display: inline-block;"></span> -->
                      <!-- <span style="color: #b45359;">Allotted (Occupied)</span> -->
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
      </div>

    <script type="module" src="/dashboard/common/js/allotments/allotments.main.js"></script>
  </body>
</html>
