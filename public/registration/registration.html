<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVAÉ - Create Account</title>
    <link rel="stylesheet" href="./style/registartion.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  </head>
  <body>
    <div class="container" id="pageContainer" style="display: none">
      <div class="form-section">
        <div class="logo">U.I.E.T</div>

        <div class="form-title">Register Yourself</div>
        <div class="form-subtitle">Access the High Computing Machine</div>

        <form id="registrationForm">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required />
          </div>

          <div class="form-group">
            <label for="branch">Branch</label>
            <select id="branch" name="branch" required>
              <option value="">Select Branch</option>
              <option value="cse">Computer Science</option>
              <option value="eee">Electrical and Electronics</option>
              <option value="mech">Mechanical</option>
              <option value="ece">Electronics and Communication</option>
              <option value="IT">Information Technology</option>
              <option value="biotech">Biotechnology</option>
              <option value="appliedsciences">Applied sciences</option>
            </select>
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter Phone Number" required />
          </div>

          <!-- Student-specific fields -->
          <div id="studentFields" style="display: none">
            <div class="form-group">
              <label for="teacher">Teacher</label>
              <select id="assignedTeacher" name="teacher">
                <option value="">Select Teacher</option>
              </select>
            </div>

            <div class="form-group">
              <label for="rollNumber">Roll Number</label>
              <input
                type="text"
                id="rollNumber"
                name="rollNumber"
                placeholder="Enter Roll Number"
              />
            </div>

            <div class="form-group">
              <label for="instituteName">Institute Name</label>
              <input
                type="text"
                id="instituteName"
                name="instituteName"
                placeholder="Enter Institute Name"
                required
              />
            </div>

            <div class="form-group">
              <label for="instituteAddress">Institute Address</label>
              <input
                type="text"
                id="instituteAddress"
                name="instituteAddress"
                placeholder="Enter Institute Address"
                required
              />
            </div>
          </div>

          <button type="submit" class="submit-btn">Sign Up</button>
        </form>
      </div>

      <div class="hero-section">
        <div class="hero-content">
          <div class="illustration">🎓</div>
          <div class="hero-title">High Speed Servers</div>
          <div class="hero-main"></div>
          <div class="hero-subtitle">U.I.E.T Panjab University</div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="./js/registration.js"></script>
  </body>
</html>
