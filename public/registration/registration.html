<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="./style/registartion.css" />
  </head>
  <body>
    <header>
      <h1>Registration Page</h1>
      <p>Please register according to your role.</p>
    </header>

    <main>
      <form id="registrationForm">
        <label for="role">I am a:</label>
        <select id="role" required>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>

        <!-- Student Fields -->
        <div id="studentFields" class="form-section">
          <input
            type="text"
            id="studentName"
            placeholder="Full Name"
            required
          />
          <input type="text" id="rollNo" placeholder="Roll Number" required />
          <input
            type="text"
            id="department"
            placeholder="Department"
            required
          />
          <select id="assignedTeacher" required>
            <option value="">Select a Teacher</option>
          </select>
        </div>

        <!-- Teacher Fields -->
        <div id="teacherFields" class="form-section" style="display: none">
          <input
            type="email"
            id="teacherEmail"
            placeholder="Official Email"
            required
          />
        </div>

        <button type="submit">Register</button>
      </form>
    </main>

    <script src="./js/registration.js"></script>
  </body>
</html>
