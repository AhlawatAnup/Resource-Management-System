<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Registration</title><base href="/"></head><body><div style="display:flex;flex-direction:row;flex-wrap:wrap;justify-content:space-around;align-items:center;background-color:#e7e7e7;border:2px solid #c7c7c7;border-radius:1.5rem;height:81vh;width:73vw;margin-left:auto;margin-right:auto;margin-top:10vh"><div id="reg-form"><form id="teacher_registration"><div class="rms-input-box-v2" style="height:60px;width:312px"><input id="fullName" type="text" required="" placeholder=" "> <label>Enter Your Full Name(Eg.- Dr. Abc Xyz)</label></div><div class="rms-input-box-v2" style="height:60px;width:312px"><input id="email" type="text" required="" placeholder=" "> <label>Enter E-mail id(Eg.- xyz@pu.ac.in)</label></div><div class="rms-input-box-v2" style="height:60px;width:312px"><input id="phone" type="text" required="" placeholder=" "> <label>Enter Your phone number(Eg.- 1234567890)</label></div><div class="form-group"><select id="branch" name="branch" required="" style="height:60px;width:312px;background:unset;border:1px solid #bdbdbd;border-radius:.6rem;color:#5d5d5d"><option value="">Select Branch</option><option value="cse">Computer Science</option><option value="eee">Electrical and Electronics</option><option value="mech">Mechanical</option><option value="ece">Electronics and Communication</option><option value="IT">Information Technology</option><option value="biotech">Biotechnology</option><option value="appliedsciences">Applied sciences</option></select></div><div><button class="login-button" id="submit-Btn">SignUp</button></div></form></div><div id="side"><img src="/assets/images/UIET-logo.png" alt="U.I.E.T." style="height:30vh"></div></div><script src="./packs/teacher_registration.packs.js"></script></body></html>
