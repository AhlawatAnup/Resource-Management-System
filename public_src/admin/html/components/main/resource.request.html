<div class="main resource-request hide-default">
  <!-- Top Navigation Bar -->
  <div class="header">
    <h2>View Resource Requests</h2>

    <!-- Part B: Status Filter -->
    <div class="nav-section">
      <button class="status-btn-resources active" data-status="all">
        <i class="fas fa-list"></i>
        All
        <span class="count-badge-resource all">0</span>
      </button>
      <button class=" status-btn-resources" data-status="active">
        <i class="fas fa-play-circle"></i>
        Active
        <span class="count-badge-resource verified">0</span>
      </button>

      <button class=" status-btn-resources" data-status="upcoming">
        <i class="fas fa-clock"></i>
        Upcoming
        <span class="count-badge-resource unverified">0</span>
      </button>

      <button class=" status-btn-resources" data-status="expired">
        <i class="fas fa-hourglass-end"></i>
        Expired
        <span class="count-badge-resource rejected">0</span>
      </button>

      <button class="status-btn-resources" data-status="rejected">
        <i class="fas fa-times-circle"></i>
        Rejected
        <span class="count-badge-resource rejected">0</span>
      </button>
    </div>
    <div class="nav-actions">
      <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
        <i id="theme-icon" class="fa fa-moon"></i>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="rms-table">
      <!-- SEARCH -->
      <div class="search-container">
        <svg viewBox="0 0 20 20" fill="currentColor">
          <path
            fill-rule="evenodd"
            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
            clip-rule="evenodd"
          />
        </svg>
        <input type="text" placeholder="Search Requests" id="searchInputResources" />
      </div>

      <!-- TABLE -->
      <table>
        <thead>
          <tr>
            <th class="sortable" data-sort="student">Student</th>
            <th class="sortable" data-sort="title">Request Title</th>
            <th class="sortable" data-sort="duration">Duration</th>
            <th class="sortable" data-sort="migid">MIG ID</th>
            <th class="sortable" data-sort="status">Status</th>
            <th class="sortable">Action</th>
          </tr>
        </thead>
        <tbody id="requestsTableBody">
          <tr>
            <td colspan="6" class="loading">Loading resource requests...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Resource Request edit modal (currently only for duration) -->
<div id="editModal" class="modal hidden">
  <div class="modal-content">
    <h3>Edit Request</h3>

    <label>Student Name</label>
    <input id="editStudentName" readonly />

    <label>Roll No</label>
    <input id="editRollNo" readonly />

    <label>Title</label>
    <input id="editTitle" readonly />

    <label>MIG ID</label>
    <input id="editMigId" readonly />

    <label>Current Duration</label>
    <input id="editDuration" readonly />

    <label>Extend Duration (in days)</label>
    <input
      id="editExtendDuration"
      placeholder="Enter number of days to extend the allotment (e.g., 2)"
    />

    <div class="modal-actions">
      <button id="editSubmitBtn">Save</button>
      <button id="editCancelBtn">Cancel</button>
    </div>
  </div>
</div>

<div id="reportModal" class="report-modal hidden">
      <div class="report-content">
        <div class="report-header">
  <div class="report-title-section">
    <div class="report-icon">
      <i class="fas fa-chart-line"></i>
    </div>

    <div>
      <h2>Machine Usage Report</h2>

      <p class="report-subtitle">
        Resource utilization analytics and monitoring
      </p>
    </div>
  </div>

  <button id="closeReportBtn">
    <i class="fas fa-times"></i>
  </button>
</div>

        <div class="report-body">
         <div class="report-details" id="reportDetails">

  <div class="detail-card">
    <div class="detail-icon student">
      <i class="fas fa-user"></i>
    </div>

    <div class="detail-content">
      <span class="detail-label">Student</span>
      <span class="detail-value" id="reportStudentName">-</span>
    </div>
  </div>

  <div class="detail-card">
    <div class="detail-icon roll">
      <i class="fas fa-id-card"></i>
    </div>

    <div class="detail-content">
      <span class="detail-label">Roll No</span>
      <span class="detail-value" id="reportRollNo">-</span>
    </div>
  </div>

  <div class="detail-card">
    <div class="detail-icon mig">
      <i class="fas fa-microchip"></i>
    </div>

    <div class="detail-content">
      <span class="detail-label">MIG ID</span>
      <span class="detail-value" id="reportMigId">-</span>
    </div>
  </div>

  <div class="detail-card">
    <div class="detail-icon duration">
      <i class="fas fa-calendar-alt"></i>
    </div>

    <div class="detail-content">
      <span class="detail-label">Duration</span>
      <span class="detail-value" id="reportDuration">-</span>
    </div>
  </div>

  <div class="detail-card">
    <div class="detail-icon start">
      <i class="fas fa-clock"></i>
    </div>

    <div class="detail-content">
      <span class="detail-label">Start</span>
      <span class="detail-value" id="reportStartTime">-</span>
    </div>
  </div>

  <div class="detail-card">
    <div class="detail-icon end">
      <i class="fas fa-hourglass-end"></i>
    </div>

    <div class="detail-content">
      <span class="detail-label">End</span>
      <span class="detail-value" id="reportEndTime">-</span>
    </div>
  </div>

</div>

          <div class="chart-container">

  <div class="chart-topbar">

  
    <div class="chart-legend">

      <div class="legend-pill cpu-pill">
        <span class="legend-dot"></span>
        CPU
      </div>

      <div class="legend-pill memory-pill">
        <span class="legend-dot"></span>
        Memory
      </div>

      <div class="legend-pill gpu-pill">
        <span class="legend-dot"></span>
        GPU
      </div>

    </div>

  </div>

  <canvas id="reportChart"></canvas>

</div>
        </div>
      </div>
    </div>
