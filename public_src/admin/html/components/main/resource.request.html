 <div class="main resource-request hide-default">
      <!-- Top Navigation Bar -->
        <div class="header">
          <h2>View Resource Requests</h2>
        
        
          <!-- Part B: Status Filter -->
          <div class="nav-section">
  <button class="status-btn active" data-status="all">
  <i class="fas fa-list"></i>
  All
   <span class="count-badge" id="all-count">0</span>
</button>
<button class="status-btn" data-status="active">
  <i class="fas fa-play-circle"></i>
  Active
   <span class="count-badge" id="active-count">0</span>
</button>

<button class="status-btn" data-status="upcoming">
  <i class="fas fa-clock"></i>
  Upcoming
   <span class="count-badge" id="upcoming-count">0</span>
</button>



<button class="status-btn" data-status="expired">
  <i class="fas fa-hourglass-end"></i>
  Expired
   <span class="count-badge" id="expired-count">0</span>
</button>

<button class="status-btn" data-status="rejected">
  <i class="fas fa-times-circle"></i>
  Rejected
   <span class="count-badge" id="rejected-count">0</span>
</button>

            </div>
            <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
            <i id="theme-icon" class="fa fa-moon"></i>
          </button>
        </div>
        </div>
        
       

      <div class="main-content">
      

        <div class="rms-table">
            <!-- SEARCH -->
            <div class="search-container">
              <svg  viewBox="0 0 20 20" fill="currentColor">
                <path
                  fill-rule="evenodd"
                  d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                  clip-rule="evenodd"
                />
              </svg>
              <input
                type="text"
                placeholder="Search Requests"
                id="searchInput"
              />
            </div>
          
           <!-- TABLE -->
            <table>
              <thead>
                <tr>
                  <th class="sortable" data-sort="student">Student</th>
                  <th class="sortable" data-sort="title">Request Title</th>
                  <th class="sortable" data-sort="duration">Duration</th>
                  <th class="sortable" data-sort="migid">MIG ID</th>
                  <th class="sortable" data-sort="status">Status</th>
                  <th class="sortable">Action</th>
                </tr>
              </thead>
              <tbody id="requestsTableBody">
                <tr>
                  <td colspan="6" class="loading">Loading resource requests...</td>
                </tr>
              </tbody>
            </table>
          
        </div>
    </div>
    
    </div>
