<div class="main profile hide-default">
        <div class="header">
          <h2>Profile</h2>
          <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
            <i id="theme-icon" class="fa fa-moon"></i>
          </button>
        </div>
        </div>

       <main class="main-content">
        <section class="profile-section">
          <h2>Admin Profile</h2>
          <div style="display: flex; align-items: center; gap: 8px ;font-size:1.5rem">
            <strong>Username:</strong> <span id="admin-username"></span>
            <div class="rms-action-edit button">
            <button
              id="edit-username-btn"
              class="nav-btn"
              style="padding: 4px 10px; font-size: 14px"
            >
              Edit
            </button>
            </div>
          </div>
          <!-- <div><strong>Name:</strong> <span id="admin-name"></span></div> -->
          <div style="display: flex; align-items: center; gap: 8px;font-size:1.5rem">
            <strong>Email:</strong> <span id="admin-email"></span>
            <div class="rms-action-edit button">
            <button id="edit-email-btn" class="nav-btn" style="padding: 4px 10px; font-size: 14px">
              Edit
            </button>
            </div>
          </div>
          <!-- Edit Email Modal -->
          <div id="edit-email-modal" class="profile-modal" style="display: none">
            <div class="profile-modal-content">
              <button class="profile-modal-close" id="close-email-modal">&times;</button>
              <h3>Edit Email</h3>
              <input
                type="email"
                id="new-email-input"
                placeholder="New Email"
                style="padding: 8px; border-radius: 6px; border: 1px solid #ccc"
              />
              <div style="display: flex; gap: 10px; margin-top: 16px">
                <div class="rms-action-approve">
                <button
                  id="submit-email-btn"
                  class="nav-btn"
                  style="background: #27ae60; color: #fff"
                >
                  Submit
                </button>
                </div>
                <div class="rms-action-reject">
                <button id="cancel-email-btn" class="nav-btn" style="background: #eee; color: #333">
                  Cancel
                </button>
                </div>
              </div>
              <div id="email-error" style="color: red"></div>
            </div>
          </div>
          <!-- Change Password Modal -->
          <div id="change-password-modal" class="profile-modal" style="display: none">
            <div class="profile-modal-content">
              <button class="profile-modal-close" id="close-password-modal">&times;</button>
              <h3>Change Password</h3>
              <input
                type="password"
                id="new-password"
                placeholder="New Password"
                style="padding: 8px; border-radius: 6px; border: 1px solid #ccc"
              />
              <input
                type="password"
                id="confirm-password"
                placeholder="Confirm Password"
                style="padding: 8px; border-radius: 6px; border: 1px solid #ccc"
              />
              <div style="display: flex; gap: 10px; margin-top: 16px">
                <div class="rms-action-approve">
                <button
                  id="submit-password-btn"
                  class="nav-btn"
                  style="background: #27ae60; color: #fff"
                >
                  Submit
                </button>
                </div >
                <div class="rms-action-reject">
                <button
                  id="cancel-password-btn"
                  class="nav-btn"
                  style="background: #eee; color: #333"
                >
                  Cancel
                </button>
                </div>
              </div>
              <div id="password-error" style="color: red"></div>
            </div>
          </div>
          <!-- Edit Username Modal -->
          <div id="edit-username-modal" class="profile-modal" style="display: none">
            <div class="profile-modal-content">

              <button class="profile-modal-close" id="close-username-modal">&times;</button>
              <h3>Edit Username</h3>
              <input
                type="text"
                id="new-username-input"
                placeholder="New Username"
                style="padding: 8px; border-radius: 6px; border: 1px solid #ccc"
              />
              <div style="display: flex; gap: 10px; margin-top: 16px">
                <div class="rms-action-approve">
                <button
                  id="submit-username-btn"
                  class="nav-btn"
                  style="background: #27ae60; color: #fff"
                >
                  Submit
                </button>
                </div>
                <div class="rms-action-reject">
                <button
                  id="cancel-username-btn"
                  class="nav-btn"
                  style="background: #eee; color: #333"
                >
                  Cancel
                </button>
                </div>
              </div>
              <div id="username-error" style="color: red"></div>
            </div>
          </div>
          <div id="profile-error" style="color: red"></div>
          <button id="change-password-btn" class="nav-btn" style="margin-top: 20px">
            Change Password
          </button>
        </section>
      </main>
    </div>
</div>
