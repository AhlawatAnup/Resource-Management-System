<!-- REPORT SECTION -->
<div id="report-side-panel" class="report-side-panel close">
  <div class="header">
    <h3>Select Report Time Period</h3>
  </div>

  <div class="body">
    <span class="text-muted">
      Select the desired date range on calendar to generate proper reports.
    </span>

    <div class="report-filter-group">
      <input type="hidden" id="report-date-range" class="close" />
    </div>

    <!-- <div class="rms-input-box-v2">
      <label>Selected Date Range</label>
      <input type="hidden" id="report-date-range" />
    </div> -->

    <div id="report-calendar-container"></div>

    <div class="dummy"></div>

    <div class="rms-btn-v1">
      <button id="generateReport">
        <i data-lucide="arrow-down-to-line" stroke-width="1.5"></i>
        Download Report
      </button>
    </div>
  </div>

  <button id="close-report-panel-btn" class="close-btn">
    <i data-lucide="X" stroke-width="1.25"></i>
  </button>
</div>
