<div class="main dashboard">
  <!-- HEADER -->
  <div class="header" style="display: none">
    <h2 id="student-welcome"></h2>
  </div>

  <div class="profile">
    <div class="left">
      <span class="avatar">S.N</span>
      <span class="name">Mr. Student Name</span>
      <span class="email text-muted">student@email.com</span>
      <span class="badge" data-status="1">Verified</span>

      <div class="rating">
        <div class="stars" style="--rating: 5" data-rating="3.5">
          <div class="empty">★★★★★</div>
          <div class="filled">★★★★★</div>
        </div>
        <span class="text-muted">5/5</span>
      </div>
    </div>

    <div class="right">
      <div class="status">
        <span class="key text-muted">Join Date</span>
        <span class="value">NA</span>
      </div>

      <!-- ---- -->

      <div class="status">
        <span class="key text-muted">Branch</span>
        <span class="value">NA</span>
      </div>

      <!-- ---- -->

      <div class="status">
        <span class="key text-muted">Roll Number</span>
        <span class="value">NA</span>
      </div>

      <!-- ---- -->

      <div class="status">
        <span class="key text-muted">Teacher Name</span>
        <span class="value">NA</span>
      </div>

      <!-- ---- -->

      <div class="status">
        <span class="key text-muted">Total Requests</span>
        <span class="value">NA</span>
      </div>

      <!-- ---- -->

      <div class="status">
        <span class="key text-muted">Account Status</span>
        <span class="value">NA</span>
      </div>

      <!-- ---- -->
      <div class="status">
        <span class="key text-muted">Institute Address</span>
        <span class="value">NA</span>
      </div>

      <!-- ---- -->

      <button id="resourceRequestsBtn">
        <i data-lucide="plus" stroke-width="1.5"></i>
        Raise New Request
      </button>

      <button id="viewRequestsBtn">
        <i data-lucide="audio-waveform" stroke-width="1.5"></i>
        View My Requests
      </button>
    </div>
    <!-- Student Profile Section -->

    <!-- --------------------- -->
  </div>
</div>
