<div class="main view-request hide-default">
  <div class="header">
    <h2>Your Raised Requests</h2>

    <!-- Part B: Status Filter -->
    <div class="nav-section">
      <button class="status-btn-resources active" data-status="all">
        <i class="fas fa-list"></i>
        All
        <span class="count-badge-resource all" style="background: #f1f5f9; color: #475569">0</span>
      </button>
      <button class="status-btn-resources" data-status="pending">
        <i class="fas fa-play-circle"></i>
        Pending
        <span class="count-badge-resource pending" style="background: #fef3c7; color: #92400e"
          >0</span
        >
      </button>

      <button class="status-btn-resources" data-status="approved">
        <i class="fas fa-clock"></i>
        Approved
        <span class="count-badge-resource approved" style="background: #dbeafe; color: #1d4ed8"
          >0</span
        >
      </button>

      <button class="status-btn-resources" data-status="rejected">
        <i class="fas fa-times-circle"></i>
        Rejected
        <span class="count-badge-resource rejected">0</span>
      </button>

      <button class="status-btn-resources" data-status="completed">
        <i class="fas fa-hourglass-end"></i>
        Completed
        <span class="count-badge-resource completed" style="background: #f0fdf4; color: #166534"
          >0</span
        >
      </button>
    </div>

    <button id="theme-toggle" class="theme-toggle" title="Dark Mode">
      <i id="theme-icon" class="fa fa-moon"></i>
    </button>
  </div>

  <div class="container">
    <!-- Requests Section -->
    <div id="requests-content">
      <!-- Content will be loaded here by JavaScript -->
    </div>
  </div>
  <div id="reportModal" class="report-modal hidden">
    <div class="report-content">
      <div class="report-header">
        <div class="report-title-section">
          <div class="report-icon">
            <i class="fas fa-chart-line"></i>
          </div>

          <div>
            <h2>Machine Usage Report</h2>

            <p class="report-subtitle">Resource utilization analytics and monitoring</p>
          </div>
        </div>

        <button id="closeReportBtn">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="report-body">
        <div class="report-details" id="reportDetails">
          <div class="detail-card">
            <div class="detail-icon student">
              <i class="fas fa-user"></i>
            </div>

            <div class="detail-content">
              <span class="detail-label">Student</span>
              <span class="detail-value" id="reportStudentName">-</span>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon roll">
              <i class="fas fa-id-card"></i>
            </div>

            <div class="detail-content">
              <span class="detail-label">Roll No</span>
              <span class="detail-value" id="reportRollNo">-</span>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon mig">
              <i class="fas fa-microchip"></i>
            </div>

            <div class="detail-content">
              <span class="detail-label">MIG ID</span>
              <span class="detail-value" id="reportMigId">-</span>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon duration">
              <i class="fas fa-calendar-alt"></i>
            </div>

            <div class="detail-content">
              <span class="detail-label">Duration</span>
              <span class="detail-value" id="reportDuration">-</span>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon start">
              <i class="fas fa-clock"></i>
            </div>

            <div class="detail-content">
              <span class="detail-label">Start</span>
              <span class="detail-value" id="reportStartTime">-</span>
            </div>
          </div>

          <div class="detail-card">
            <div class="detail-icon end">
              <i class="fas fa-hourglass-end"></i>
            </div>

            <div class="detail-content">
              <span class="detail-label">End</span>
              <span class="detail-value" id="reportEndTime">-</span>
            </div>
          </div>
        </div>

        <div class="chart-container">
          <div class="chart-topbar">
            <div class="chart-legend">
              <div class="legend-pill cpu-pill">
                <span class="legend-dot"></span>
                CPU
              </div>

              <div class="legend-pill memory-pill">
                <span class="legend-dot"></span>
                Memory
              </div>

              <div class="legend-pill gpu-pill">
                <span class="legend-dot"></span>
                GPU
              </div>
            </div>
          </div>

          <canvas id="reportChart"></canvas>
        </div>
      </div>
    </div>
  </div>
</div>
